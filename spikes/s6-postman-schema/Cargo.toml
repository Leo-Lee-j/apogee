[package]
name = "s6-postman-schema"
description = "Spike S6：用官方 Postman v2.1.0 schema 校验真实导出文件，决定导入器走严格校验还是宽松解析"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "s6"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# 关键：关掉默认 feature。
# jsonschema 默认带远程 $ref 解析，会把 reqwest + hyper + rustls 整条 HTTP 栈拖进来。
# 我们用的是本地 schema 副本（03 文档 §8.3），不需要联网解析 —— 这对
# 「安装包 < 15MB」的预算是实打实的差别。这条约束要带进生产代码。
jsonschema = { version = "0.60", default-features = false }
