# cargo-deny 配置 —— 开源发布的第三方许可与供应链门禁。
#
# Apogee 源码以 MIT 发布，但第三方组件仍须兼容其各自的许可证，并在二进制
# 发布物中附带归属声明（见 about.toml）。本文件让不兼容许可证、未知来源和
# 已知安全公告在 CI 阶段直接失败，而不是等到发布前才发现。
# 运行：cargo deny check

[graph]
all-features = false

# 只检查**实际会分发**的目标平台（当前：Windows + macOS）。
# 不设 targets 会把不进入发行产物的 Linux 专用 GTK 依赖及其 advisory 也纳入，
# 产生噪声并掩盖真正需要处理的风险。
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
version = 2

# ── 允许的许可（白名单）──────────────────────────────────────────────
# 仅接受与本项目分发策略兼容的许可证。新增条目前必须确认再分发义务。
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",       # 文件级 copyleft；修改依赖源码前必须重新评估
]

# 置信度阈值：低于此值的许可识别结果视为未知，会触发失败
confidence-threshold = 0.9

# 例外清单：留空。任何例外都必须显式写在这里并附理由，避免默默放水。
exceptions = []

# 工作区 crate 的许可证由根目录 LICENSE 与 workspace.package.license 声明；
# 这里仅审计会随产品分发的第三方依赖，避免重复检查自身源码。
[licenses.private]
ignore = true

[[licenses.clarify]]
# SQLite 是公有领域（bundled 进 rusqlite），许可元数据识别不稳定，显式声明
name = "libsqlite3-sys"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"          # 禁止 "*" 版本号，依赖必须可复现
# 工作区内部 path 依赖（apogee-core）不写版本号，属于正常做法，放行。
# 这个豁免只对 path 依赖生效，对 crates.io 依赖仍然强制写版本。
allow-wildcard-paths = true
highlight = "all"

# ── 明确禁止的 crate ─────────────────────────────────────────────────
deny = [
    # 体积杀手：与「安装包 < 15MB」直接冲突（PRD §5 / 03 文档 §1.2）
    { name = "deno_core", reason = "嵌入式 JS 运行时体积过大，脚本引擎已定 QuickJS(rquickjs)，见决策 D5" },
    # 安全与合规
    { name = "openssl-sys", reason = "统一走 rustls，避免跨平台编译依赖与许可复杂度" },
]

[advisories]
version = 2
yanked = "deny"

# ── 已知且当前无解的 advisory ────────────────────────────────────────
#
# 规则：每条都要写清「为什么现在不能修」和「什么时候复查」。
# 不允许出现没有理由的 ignore —— 那等于关掉了整个 advisories 检查。
#
# 这些条目均为“已停止维护”而非已知可利用漏洞，且公告明确没有安全升级路径。
# 复查时机：每次执行 `cargo update`，或升级 Tauri/fontdb 时重新运行
# `cargo deny check advisories`；存在可替代版本时立刻移除对应 ignore。
ignore = [
    # urlpattern → tauri-utils → tauri。rust-unic 整个项目已停止维护。
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range：经 urlpattern 传递自 tauri-utils，上游无可用替代" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common：同上" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property：同上" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version：同上" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident：同上" },
    # fontdb 仅用于枚举本机字体族；ttf-parser 是其唯一上游依赖，公告无安全升级。
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser：由 fontdb 0.23.0 引入，仅用于本机字体枚举；公告无可用安全升级，升级或替换 fontdb 时必须复查" },
]
# 注：限定 targets 后，原先出现的 8 条 gtk-rs GTK3 advisory 和
# proc-macro-error(RUSTSEC-2024-0370) 都不再进入依赖图，所以不需要 ignore。
# cargo-deny 会对「写了但用不到的 ignore」发 advisory-not-detected 警告 ——
# 这个警告是好东西，能防止例外清单变成只增不减的垃圾堆。

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
