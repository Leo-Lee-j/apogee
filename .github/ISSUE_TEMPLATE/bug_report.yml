name: Bug report
description: Report a reproducible problem in Apogee
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Apogee. Do not include API keys, cookies, private URLs, real request/response bodies, or other secrets.

  - type: input
    id: version
    attributes:
      label: Apogee version or commit
      description: Include the Release version, installer filename, or commit SHA.
      placeholder: '0.1.0 / abc1234'
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Installation source
      options:
        - Official Windows NSIS installer
        - Built from source
        - Other / not applicable
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: 'Windows 11 23H2 x64'
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction steps
      description: Use sanitized data and list the smallest sequence that demonstrates the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior, errors, and sanitized logs
      description: Remove credentials, cookies, private hostnames, and user data before pasting output.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, recording, regression range, and attempted workarounds are helpful when safely sanitized.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
        - label: This is not a security vulnerability or private disclosure.
          required: true
