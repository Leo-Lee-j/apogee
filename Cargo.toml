[workspace]
resolver = "2"
members = ["crates/apogee-core", "src-tauri", "spikes/s6-postman-schema"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-proprietary"
publish = false

# 决策 D6：闭源发布。所有 crate 标记 publish = false，避免误发到 crates.io。
# 依赖许可白名单见 deny.toml（PRD §9.5）。

[workspace.dependencies]
apogee-core = { path = "crates/apogee-core" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
base64 = "0.22"
curl-parser = { version = "0.6", default-features = false, features = ["uri"] }
url = "2.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
# 仅用于 `FutureExt::catch_unwind`,把 spawned task 的 panic 转成 `request:error`
# 事件而非 abort 整进程(`panic = "abort"` 下)。Release 不引入异步运行时,体积增量可忽略。
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4", "serde"] }

# ── HTTP 客户端（03 文档 §2.1 技术选型）───────────────────────────────
#
# `default-features = false` 是硬要求：默认 feature 会带 `default-tls`
# （native-tls → Windows 上是 schannel，macOS 上是 Security.framework），
# 03 文档 §2.1 明确选 rustls 以「避免跨平台编译地狱」。
#
# ⚠️ feature 名在 reqwest 0.13 变了：旧版的 `rustls-tls` 已不存在。
# 现在是 `rustls`（隐含 aws-lc-rs 后端）与 `rustls-no-provider`（自带后端）两条路。
# 这里必须走后者 —— `rustls` 会拖进 aws-lc-rs，那需要 NASM + CMake 才能在
# Windows 上编译，而开发机与 CI 都不装。改用 rustls 的 ring 后端（见下条），
# ring 0.17 在 windows-msvc 上自带预生成汇编，只要 MSVC 工具链即可。
#
# `multipart` + `stream` 用于 FormData/Binary 大文件流式上传；新增依赖体积需纳入 S5 门禁。
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "rustls-native-certs",   # 用系统根证书，企业内网自签 CA 才能开箱可用
    "http2",
    "gzip",
    "brotli",
    "deflate",
    "multipart",
    "stream",
] }
# rustls 的加密后端。显式选 ring 而不是默认的 aws-lc-rs，理由见上。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["io"] }

# ── 性能预算相关（PRD §5 / 03 文档 §4.7）─────────────────────────────
# opt-level = "z" + lto = "fat" + codegen-units = 1 + panic = "abort" + strip
# 是「安装包 < 15MB」的前提，release 构建必须保持这组配置。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Spike 与本地性能测量用：保留符号但开优化，便于定位热点
[profile.bench]
inherits = "release"
opt-level = 3
lto = "thin"
strip = false
debug = true

# dev 下依赖也开一点优化，否则 10MB/100MB body 的 Spike 在 debug 下噪声太大
[profile.dev.package."*"]
opt-level = 2
