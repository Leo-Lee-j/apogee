[workspace]
resolver = "2"
members = ["crates/apogee-core", "src-tauri", "spikes/s6-postman-schema"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-proprietary"
publish = false

# 决策 D6：闭源发布。所有 crate 标记 publish = false，避免误发到 crates.io。
# 依赖许可白名单见 deny.toml（PRD §9.5）。

[workspace.dependencies]
apogee-core = { path = "crates/apogee-core" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── 性能预算相关（PRD §5 / 03 文档 §4.7）─────────────────────────────
# opt-level = "z" + lto = "fat" + codegen-units = 1 + panic = "abort" + strip
# 是「安装包 < 15MB」的前提，release 构建必须保持这组配置。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Spike 与本地性能测量用：保留符号但开优化，便于定位热点
[profile.bench]
inherits = "release"
opt-level = 3
lto = "thin"
strip = false
debug = true

# dev 下依赖也开一点优化，否则 10MB/100MB body 的 Spike 在 debug 下噪声太大
[profile.dev.package."*"]
opt-level = 2
