# cargo-about 配置 —— 生成 THIRD-PARTY-NOTICES.txt。
#
# 即使 Apogee 源码按 MIT 公开，分发 Windows/macOS 安装包时仍必须保留
# 所有第三方组件的版权与许可证声明。发布工作流会生成并随 Release 附带此文件。
#
# 生成：cargo about generate about.hbs -o THIRD-PARTY-NOTICES.txt

# 只针对实际会分发的目标平台收集依赖（当前：Windows + macOS）
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# 忽略 build-dependencies 与 dev-dependencies（不进最终产物，无需声明）
ignore-build-dependencies = true
ignore-dev-dependencies = true

# 归属声明只列出第三方组件；项目自身的 MIT 许可由根目录 LICENSE 负责。
# 与 deny.toml 的 [licenses.private] ignore = true 一致。
private = { ignore = true }

workarounds = []

# 与 deny.toml 保持一致的许可白名单。
# 两处必须同步：deny.toml 负责阻断，about.toml 负责声明。
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
]
