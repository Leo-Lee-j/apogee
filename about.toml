# cargo-about 配置 —— 生成 THIRD-PARTY-NOTICES.txt
#
# 对应决策 D6 / PRD §9.5：MIT、Apache-2.0、BSD 等许可要求分发时附带版权与许可声明。
# 这是**强制项**，不是可选项 —— 闭源产品尤其需要，因为用户无法从源码里看到这些声明。
#
# 生成：cargo about generate about.hbs -o THIRD-PARTY-NOTICES.txt
# 该产物必须随安装包分发，并在「关于」页可查。

# 只针对实际会分发的目标平台收集依赖（决策 D2：仅 Windows + macOS）
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# 忽略 build-dependencies 与 dev-dependencies（不进最终产物，无需声明）
ignore-build-dependencies = true
ignore-dev-dependencies = true

# 跳过工作区内部 crate（publish = false 的那些）。
# 它们标的是 LicenseRef-proprietary，不是 SPDX 标准许可，本来也不需要
# 对自己做归属声明 —— 这份文件是给**第三方**开源组件用的。
# 与 deny.toml 的 [licenses.private] ignore = true 一致。
private = { ignore = true }

workarounds = []

# 与 deny.toml 保持一致的许可白名单。
# 两处必须同步：deny.toml 负责阻断，about.toml 负责声明。
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
]
